name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          # Single source of truth: .nvmrc drives contributor and CI Node alike.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Advisory-diff gate: fails only when a NEW npm-audit advisory id appears
      # beyond the triaged allowlist (.github/audit-allowlist.json). Pre-existing
      # build-time advisories stay informational. See docs/security-and-supply-chain.md.
      - run: npm run audit:diff
      # Fails if an auto-loading vendored skill plugin's SHA pin drifts.
      - run: npm run vendored:check

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Enforcement backstop for the key-hygiene rule (the pre-commit hook is
      # local-only and --no-verify-bypassable). Free for public repos.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
