version: 2
updates:
  # ── npm ──────────────────────────────────────────────────────────────────
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    groups:
      # Expo SDK 57 owns ONE mutually-compatible native pin set (Skia ↔
      # Reanimated ↔ Gesture Handler ↔ Worklets ↔ RN ↔ React). Bumping one in
      # isolation breaks the set, so these move together and are NEVER
      # auto-merged — upgrade only via `npx expo install --fix`. Grouped so
      # Dependabot proposes them in a single, review-only PR.
      # See docs/security-and-supply-chain.md.
      expo-native:
        patterns:
          - 'expo'
          - 'expo-*'
          - 'react'
          - 'react-dom'
          - 'react-native'
          - 'react-native-*'
          - '@shopify/react-native-skia'
      # Dev tooling — low-risk, batched into one PR to cut noise.
      dev-tooling:
        patterns:
          - '@types/*'
          - 'eslint'
          - 'eslint-*'
          - 'prettier'
          - 'typescript'
          - 'vitest'
          # @vitest/coverage-v8 is version-locked to vitest (dynamically imported
          # by it, not a strict npm peer) — grouped here so both bump in ONE PR
          # and can never version-skew when this group is auto-merged.
          - '@vitest/*'
          - 'husky'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
    # Major bumps of the ESLint + TypeScript toolchain are owned by the Expo SDK
    # preset (`eslint-config-expo`, pinned to SDK 57): a standalone major breaks
    # `expo lint` — TS 7 removes internals `@typescript-eslint` reads, ESLint 10
    # changes the import-resolver interface. These majors land only with an Expo
    # SDK upgrade via `npx expo install`, never as standalone Dependabot PRs.
    # Minor/patch still flow through the dev-tooling group above.
    # See docs/security-and-supply-chain.md.
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      # Expo/native pin set: the Expo SDK owns these versions as ONE compatible
      # set (upgrade only via `npx expo install --fix`). Grouping them above as
      # "review-only" does NOT stop a merge — a grouped bump
      # (react-native-worklets 0.10.1 -> 0.11.4, above the SDK pin) shipped a
      # launch-crashing native/JS worklets mismatch. So Dependabot must not open
      # VERSION-update PRs for them at all; the SDK is the sole version owner.
      #
      # Each entry lists all three `version-update` semver levels EXPLICITLY, not
      # a bare dependency-name. This is load-bearing: GitHub applies `update-types`
      # to version updates only ("security updates will always be created
      # regardless of the update-types setting"), so listing them blocks every
      # version bump while KEEPING the Dependabot security channel alive. A bare
      # `dependency-name` ignore (no update-types) would silence SECURITY PRs too
      # — it ignores the dependency wholesale. Security updates still batch via
      # the expo-native group above. GitHub's ignore<->security interaction has
      # misbehaved per-ecosystem (dependabot-core#4027), so confirm on this repo
      # that a security advisory still opens a PR for an ignored package.
      # See docs/security-and-supply-chain.md.
      - dependency-name: 'expo'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'expo-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native-*'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@shopify/react-native-skia'
        update-types:
          - 'version-update:semver-major'
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  # ── GitHub Actions ───────────────────────────────────────────────────────
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'github-actions'
